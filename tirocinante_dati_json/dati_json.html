<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correzione</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Imposta il colore di sfondo celeste per il body */
        body {
            background-color: #e0f7fa;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            font-size: 24px;
            color: #0277bd;
        }

        /* Contenitore per il modulo */
        .form-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Stile dei campi di input */
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #0288d1;
            border-radius: 5px;
            background-color: #f1f1f1;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #0277bd;
            background-color: #ffffff;
        }

        /* Pulsante di salvataggio */
        button {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0277bd;
        }

        /* Media query per schermi più piccoli */
        @media (max-width: 768px) {
            .form-container {
                width: 90%;
                padding: 15px;
            }

            h2 {
                font-size: 20px;
            }

            input[type="text"] {
                font-size: 14px;
            }

            button {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <h2>Modifica Dati</h2>

    <div class="form-container">
        <form name="mio_form">
            Nome: <input type="text" name="nome"><br>
            Cognome: <input type="text" name="cognome"><br>
            Tipo Mansione: <input type="text" name="tipo_mansione"><br>
            Nome Chimico: <input type="text" name="nome_chimico"><br>
            Tipo Materiale: <input type="text" name="tipo_materiale"><br>
            Tipo Componente: <input type="text" name="tipo_componente"><br>
            <button type="button" onclick="salvaDati()">Salva</button>
        </form>
    </div>

    <script>
        function salvaDati() {
            let form = document.forms["mio_form"];

            let servizi = {
                nome: form.elements["nome"].value,
                cognome: form.elements["cognome"].value,
                tipo_mansione: form.elements["tipo_mansione"].value,
                nome_chimico: form.elements["nome_chimico"].value,
                tipo_materiale: form.elements["tipo_materiale"].value,
                tipo_componente: form.elements["tipo_componente"].value,
                data: new Date().toLocaleString()
            };

            // Effettuare la chiamata AJAX per inviare i dati
            $.ajax({
                url: '',  // Destinazione della chiamata
                type: 'POST',
                data: JSON.stringify(servizi),  // Dati da inviare come JSON
                contentType: 'application/json',
                success: function(response) {
                    console.log("Dati inviati correttamente");
                    // Salvo i dati nel localStorage
                    localStorage.setItem('serviziData', JSON.stringify(servizi));
                    window.location.href = 'dati.html';  // Reindirizza alla pagina dei dati
                },
                error: function(xhr, status, error) {
                    console.error("Errore nella chiamata AJAX: ", error);
                }
            });
        }
    </script>

</body>
</html>
